spring.application.name=logitrack

# Valores padrão apontam para o PostgreSQL do docker compose, exposto em localhost:5433.
# Dentro do container da aplicação, as variáveis de ambiente sobrescrevem esses valores.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/logitrack}
spring.datasource.username=${DB_USER:logitrack}
spring.datasource.password=${DB_PASSWORD:logitrack}

# O schema é responsabilidade das migrations (Flyway); o Hibernate só confere se as entidades batem com ele.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Sessão só por cookie: evita o ";jsessionid=..." nas URLs de redirect
server.servlet.session.tracking-modes=cookie

# Adiciona um hash do conteúdo no nome dos arquivos estáticos (app-<hash>.css): o navegador
# nunca usa um CSS antigo do cache depois de uma alteração.
spring.web.resources.chain.strategy.content.enabled=true
spring.web.resources.chain.strategy.content.paths=/**

# Interface em português independentemente do idioma do navegador (nomes de mês, mensagens)
spring.web.locale=pt_BR
spring.web.locale-resolver=fixed

# Usuário único em memória (veja o README). Em um ambiente real, sobrescreva por variável de ambiente.
app.seguranca.usuario=${APP_USUARIO:gestor}
app.seguranca.senha=${APP_SENHA:logitrack123}
