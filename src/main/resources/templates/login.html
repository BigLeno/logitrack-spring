<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Entrar')}"></head>
<body>
<main class="container login">
    <article>
        <header>
            <span class="marca">
                <span class="marca-icone"><svg th:replace="~{fragments/icones :: caminhao}"></svg></span>
                LogiTrack
            </span>
            <p class="subtitulo">Gestão de frota</p>
        </header>

        <p th:if="${param.error}" class="erro-campo" role="alert">Usuário ou senha inválidos.</p>
        <p th:if="${param.logout}" role="status">Você saiu do sistema.</p>

        <form method="post" th:action="@{/login}">
            <label for="username">Usuário
                <input type="text" id="username" name="username" autocomplete="username" required autofocus>
            </label>
            <label for="password">Senha
                <input type="password" id="password" name="password" autocomplete="current-password" required>
            </label>
            <button type="submit">Entrar</button>
        </form>
    </article>
</main>
</body>
</html>
