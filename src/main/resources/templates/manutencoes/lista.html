<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Manutenções')}"></head>
<body>
<header th:replace="~{fragments/layout :: nav('manutencoes')}"></header>

<main class="container">
    <div class="cabecalho">
        <h1>Manutenções</h1>
        <a role="button" th:href="@{/manutencoes/nova}" data-modal>Agendar manutenção</a>
    </div>

    <div th:replace="~{fragments/layout :: mensagem}"></div>

    <p th:if="${#lists.isEmpty(manutencoes)}">Nenhuma manutenção cadastrada.</p>

    <div class="overflow-auto" th:unless="${#lists.isEmpty(manutencoes)}">
        <table class="striped">
            <thead>
            <tr>
                <th>Veículo</th>
                <th>Serviço</th>
                <th>Início</th>
                <th>Finalização prevista</th>
                <th class="numero">Custo estimado</th>
                <th>Status</th>
                <th></th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="m : ${manutencoes}">
                <td>
                    <strong class="nowrap" th:text="${m.placa}">ABC-1234</strong><br>
                    <small th:text="${m.modelo}">Modelo</small>
                </td>
                <td th:text="${m.tipoServico}">Troca de óleo</td>
                <td class="nowrap" th:text="${#temporals.format(m.dataInicio, 'dd/MM/yyyy')}">01/01/2026</td>
                <td class="nowrap" th:text="${m.dataFinalizacao != null ? #temporals.format(m.dataFinalizacao, 'dd/MM/yyyy') : '—'}">02/01/2026</td>
                <td class="numero nowrap" th:text="${'R$ ' + #numbers.formatDecimal(m.custoEstimado, 1, 'POINT', 2, 'COMMA')}">R$ 0,00</td>
                <td><span th:class="'badge badge-' + ${m.status.name()}" th:text="${m.status.descricao}">Pendente</span></td>
                <td>
                    <div class="acoes">
                        <a role="button" class="outline icone" th:href="@{/manutencoes/{id}/editar(id=${m.id})}"
                           title="Editar" aria-label="Editar" data-modal>
                            <svg th:replace="~{fragments/icones :: lapis}"></svg>
                        </a>
                        <form method="post" th:action="@{/manutencoes/{id}/excluir(id=${m.id})}"
                              data-confirmar="Excluir manutenção?"
                              th:attr="data-detalhe=${m.tipoServico + ' · ' + m.placa + ' · ' + #temporals.format(m.dataInicio, 'dd/MM/yyyy')}">
                            <button type="submit" class="secondary outline icone" title="Excluir" aria-label="Excluir">
                                <svg th:replace="~{fragments/icones :: lixeira}"></svg>
                            </button>
                        </form>
                    </div>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</main>

<th:block th:replace="~{fragments/layout :: dialogos}"></th:block>
</body>
</html>
