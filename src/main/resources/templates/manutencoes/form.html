<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${manutencaoId == null ? 'Agendar manutenção' : 'Editar manutenção'})}"></head>
<body>
<header th:replace="~{fragments/layout :: nav('manutencoes')}"></header>

<main class="container">
    <h1 th:text="${manutencaoId == null ? 'Agendar manutenção' : 'Editar manutenção'}">Agendar manutenção</h1>

    <form method="post" novalidate th:object="${form}"
          th:action="${manutencaoId == null} ? @{/manutencoes} : @{/manutencoes/{id}(id=${manutencaoId})}">

        <label for="veiculoId">Veículo
            <select th:field="*{veiculoId}" th:aria-invalid="${#fields.hasErrors('veiculoId')} ? 'true' : null">
                <option value="">Selecione…</option>
                <option th:each="v : ${veiculos}" th:value="${v.id}" th:text="${v.descricao}">ABC-1234 — Modelo</option>
            </select>
            <small class="erro-campo" th:if="${#fields.hasErrors('veiculoId')}" th:errors="*{veiculoId}"></small>
        </label>

        <div class="grid">
            <label for="dataInicio">Data de início
                <input type="date" th:field="*{dataInicio}"
                       th:aria-invalid="${#fields.hasErrors('dataInicio')} ? 'true' : null">
                <small class="erro-campo" th:if="${#fields.hasErrors('dataInicio')}" th:errors="*{dataInicio}"></small>
            </label>

            <label for="dataFinalizacao">Finalização prevista
                <input type="date" th:field="*{dataFinalizacao}"
                       th:aria-invalid="${#fields.hasErrors('dataFinalizacao') or #fields.hasErrors('periodoValido')} ? 'true' : null">
                <small class="erro-campo" th:if="${#fields.hasErrors('dataFinalizacao')}" th:errors="*{dataFinalizacao}"></small>
                <small class="erro-campo" th:if="${#fields.hasErrors('periodoValido')}" th:errors="*{periodoValido}"></small>
            </label>
        </div>

        <label for="tipoServico">Tipo de serviço
            <input type="text" th:field="*{tipoServico}" maxlength="100" placeholder="Ex.: Troca de óleo"
                   th:aria-invalid="${#fields.hasErrors('tipoServico')} ? 'true' : null">
            <small class="erro-campo" th:if="${#fields.hasErrors('tipoServico')}" th:errors="*{tipoServico}"></small>
        </label>

        <div class="grid">
            <label for="custoEstimado">Custo estimado (R$)
                <input type="number" step="0.01" min="0" th:field="*{custoEstimado}"
                       th:aria-invalid="${#fields.hasErrors('custoEstimado')} ? 'true' : null">
                <small class="erro-campo" th:if="${#fields.hasErrors('custoEstimado')}" th:errors="*{custoEstimado}"></small>
            </label>

            <label for="status">Status
                <select th:field="*{status}" th:aria-invalid="${#fields.hasErrors('status')} ? 'true' : null">
                    <option th:each="s : ${opcoesStatus}" th:value="${s}" th:text="${s.descricao}">Pendente</option>
                </select>
                <small class="erro-campo" th:if="${#fields.hasErrors('status')}" th:errors="*{status}"></small>
            </label>
        </div>

        <div class="grid">
            <button type="submit">Salvar</button>
            <a role="button" class="secondary outline" th:href="@{/manutencoes}">Cancelar</a>
        </div>
    </form>
</main>
</body>
</html>
