<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:fragment="head(titulo)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${titulo} + ' · LogiTrack'">LogiTrack</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2.0.6/css/pico.min.css">
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <link rel="icon" type="image/svg+xml" th:href="@{/favicon.svg}">
    <script defer th:src="@{/js/app.js}"></script>
</head>
<body>

<!-- ativo: 'dashboard' ou 'manutencoes', para destacar o link da página atual -->
<header th:fragment="nav(ativo)" class="topo">
    <nav class="container">
        <ul>
            <li>
                <a th:href="@{/dashboard}" class="marca">
                    <span class="marca-icone"><svg th:replace="~{fragments/icones :: caminhao}"></svg></span>
                    LogiTrack
                </a>
            </li>
        </ul>
        <ul>
            <li><a th:href="@{/dashboard}" th:classappend="${ativo == 'dashboard'} ? 'ativo'"
                   th:attr="aria-current=${ativo == 'dashboard'} ? 'page'">Dashboard</a></li>
            <li><a th:href="@{/manutencoes}" th:classappend="${ativo == 'manutencoes'} ? 'ativo'"
                   th:attr="aria-current=${ativo == 'manutencoes'} ? 'page'">Manutenções</a></li>
            <li sec:authorize="isAuthenticated()">
                <details class="menu-usuario">
                    <summary aria-label="Menu do usuário">
                        <span class="avatar" th:text="${#strings.toUpperCase(#strings.substring(#authentication.name, 0, 1))}">G</span>
                    </summary>
                    <div class="menu-painel">
                        <div class="menu-cabecalho">
                            <span class="avatar avatar-pequeno"
                                  th:text="${#strings.toUpperCase(#strings.substring(#authentication.name, 0, 1))}">G</span>
                            <div class="menu-identidade">
                                <strong sec:authentication="name">usuário</strong>
                                <small sec:authorize="hasRole('GESTOR')">Gestor de frota</small>
                            </div>
                        </div>
                        <form method="post" th:action="@{/logout}">
                            <button type="submit" class="menu-item menu-sair">
                                <svg th:replace="~{fragments/icones :: sair}"></svg>
                                Sair
                            </button>
                        </form>
                    </div>
                </details>
            </li>
        </ul>
    </nav>
</header>

<!-- Mensagens de retorno (flash attributes) após um redirect -->
<th:block th:fragment="mensagem">
    <div th:if="${mensagem}" class="alerta-sucesso" role="status" th:text="${mensagem}"></div>
    <div th:if="${erro}" class="alerta alerta-erro" role="alert" th:text="${erro}"></div>
</th:block>

<!-- Marca no topo da tela de login -->
<div th:fragment="marca-acesso" class="acesso-marca">
    <span class="marca-icone"><svg th:replace="~{fragments/icones :: caminhao}"></svg></span>
    <div>
        <strong>LogiTrack</strong>
        <small>Gestão de frota</small>
    </div>
</div>

<!-- Campo de senha com botão para mostrar/ocultar (o botão só aparece com JavaScript) -->
<div th:fragment="campo-senha(id, nome, autocompletar)" class="campo-senha">
    <input type="password" th:id="${id}" th:name="${nome}" th:attr="autocomplete=${autocompletar}" required>
    <button type="button" class="mostrar-senha" data-alternar-senha hidden
            aria-label="Mostrar senha" aria-pressed="false" title="Mostrar senha">
        <span class="se-oculta"><svg th:replace="~{fragments/icones :: olho}"></svg></span>
        <span class="se-visivel"><svg th:replace="~{fragments/icones :: olho-fechado}"></svg></span>
    </button>
</div>

<!-- Modais usados pelo static/js/app.js -->
<th:block th:fragment="dialogos">
    <dialog id="dialogo-confirmacao" class="dialogo-confirmacao" aria-labelledby="confirmacao-titulo">
        <article>
            <div class="confirmacao-corpo">
                <span class="confirmacao-icone"><svg th:replace="~{fragments/icones :: lixeira}"></svg></span>
                <div>
                    <h3 id="confirmacao-titulo" data-titulo>Confirmar?</h3>
                    <p class="confirmacao-detalhe" data-detalhe></p>
                    <p class="confirmacao-aviso">Esta ação não pode ser desfeita.</p>
                </div>
            </div>
            <footer>
                <button type="button" class="secondary outline" data-fechar>Cancelar</button>
                <button type="button" class="botao-perigo" data-confirmar-acao>Excluir</button>
            </footer>
        </article>
    </dialog>

    <dialog id="dialogo-formulario" class="dialogo-formulario" aria-label="Formulário"></dialog>
</th:block>

</body>
</html>
