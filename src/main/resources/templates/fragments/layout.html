<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:fragment="head(titulo)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${titulo} + ' · LogiTrack'">LogiTrack</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2.0.6/css/pico.min.css">
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <link rel="icon" href="data:,">
</head>
<body>

<!-- ativo: 'dashboard' ou 'manutencoes', para destacar o link da página atual -->
<header th:fragment="nav(ativo)" class="topo">
    <nav class="container">
        <ul>
            <li>
                <a th:href="@{/dashboard}" class="marca">
                    <span class="marca-icone"><svg th:replace="~{fragments/icones :: caminhao}"></svg></span>
                    LogiTrack
                </a>
            </li>
        </ul>
        <ul>
            <li><a th:href="@{/dashboard}" th:classappend="${ativo == 'dashboard'} ? 'ativo'"
                   th:attr="aria-current=${ativo == 'dashboard'} ? 'page'">Dashboard</a></li>
            <li><a th:href="@{/manutencoes}" th:classappend="${ativo == 'manutencoes'} ? 'ativo'"
                   th:attr="aria-current=${ativo == 'manutencoes'} ? 'page'">Manutenções</a></li>
            <li sec:authorize="isAuthenticated()">
                <form method="post" th:action="@{/logout}" class="sair">
                    <span class="usuario" sec:authentication="name">usuário</span>
                    <button type="submit" class="secondary outline">Sair</button>
                </form>
            </li>
        </ul>
    </nav>
</header>

<div th:fragment="mensagem" th:if="${mensagem}" class="alerta-sucesso" role="status" th:text="${mensagem}"></div>

</body>
</html>
